<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Room</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f4;--pn:#fff;--ln:#e6e4de;--l2:#d4d1c8;--tx:#1a1917;--t2:#6b675e;--mu:#9d988c;
--ac:#8a6a1c;--po:#1d6b4c;--ne:#9b2f2f;--in:#2c5680;--wm:#fcf9f0;--cl:#f2f7f4;--rd:#fcf4f4;--bl:#f4f7fb}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:400 13.5px/1.6 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.m{font-family:'IBM Plex Mono',monospace}
.hd{background:var(--pn);border-bottom:1px solid var(--l2);position:sticky;top:0;z-index:60}
.hi{max-width:1560px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lg{font-weight:700;font-size:18px;letter-spacing:-.4px;line-height:1}
.lg s{display:block;text-decoration:none;font-weight:400;color:var(--t2);font-size:10px;letter-spacing:1.6px;margin-top:3px;text-transform:uppercase}
.st{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bd{font:500 9.5px/1 'IBM Plex Mono';letter-spacing:.6px;padding:6px 9px;border-radius:3px;background:var(--wm);border:1px solid var(--ln);color:var(--t2);text-transform:uppercase}
.bd b{color:var(--tx);font-weight:700}
.bd.f{background:var(--cl);border-color:#c9e2d5;color:var(--po)}
.bd.a{background:var(--rd);border-color:#e6c8c8;color:var(--ne)}
.tabs{max-width:1560px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--ln)}
.tab{padding:11px 16px;font:600 12px/1 'IBM Plex Sans';letter-spacing:.3px;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab i{font-style:normal;font-size:11px;opacity:.65}
.tab:hover{color:var(--tx);background:var(--wm)}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);background:var(--wm)}
.w{max-width:1560px;margin:0 auto;padding:22px 20px 80px}
.pn{display:none}.pn.on{display:block}
h2{font:600 11px/1 'IBM Plex Mono';letter-spacing:1.8px;color:var(--t2);text-transform:uppercase;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--l2)}
h2:first-child{margin-top:0}h2 b{color:var(--ac)}
h3{font:600 15px/1.3 'IBM Plex Sans';margin-bottom:8px}
.ld{font-size:14px;line-height:1.65;color:#3c3a33;margin-bottom:14px;max-width:1050px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:15px 17px;margin-bottom:13px}
.c.h{background:var(--wm);border-color:var(--l2)}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.cl{font-weight:600;font-size:14.5px;line-height:1.3}
.cl s{display:block;text-decoration:none;font-weight:400;font-size:10.5px;color:var(--t2);letter-spacing:.5px;margin-top:3px;text-transform:uppercase}
.g{font:500 9px/1 'IBM Plex Mono';letter-spacing:.8px;padding:4px 8px;border-radius:3px;text-transform:uppercase;background:var(--wm);border:1px solid var(--ln);color:var(--t2);white-space:nowrap}
.g.p{background:var(--cl);border-color:#c9e2d5;color:var(--po)}
.g.n{background:var(--rd);border-color:#e6c8c8;color:var(--ne)}
.g.a{background:var(--wm);border-color:#e8dfc4;color:var(--ac)}
.g.i{background:var(--bl);border-color:#d0dcea;color:var(--in)}
.g.m{opacity:.55}
.gr{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.b{border-left:2px solid var(--ln);padding:9px 0 9px 12px;margin:9px 0;font-size:12.5px;line-height:1.65}
.b .h{font:600 9px/1 'IBM Plex Mono';letter-spacing:1.2px;color:var(--t2);text-transform:uppercase;margin-bottom:6px}
.b.p{border-color:#c9e2d5;background:var(--cl)}.b.p .h{color:var(--po)}
.b.n{border-color:#e6c8c8;background:var(--rd)}.b.n .h{color:var(--ne)}
.b.a{border-color:#e8dfc4;background:var(--wm)}.b.a .h{color:var(--ac)}
.b.i{border-color:#d0dcea;background:var(--bl)}.b.i .h{color:var(--in)}
.b.mt{border-color:var(--ac);background:var(--wm);font-style:italic}
.b.mt .h{color:var(--ac);font-style:normal}
.t{overflow-x:auto;border:1px solid var(--ln);border-radius:6px;background:var(--pn)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font:600 9px/1.4 'IBM Plex Mono';letter-spacing:1px;color:var(--t2);text-transform:uppercase;text-align:left;padding:10px 11px;border-bottom:1px solid var(--l2);background:var(--wm);white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--ln);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.wr td{white-space:normal}
th.r,td.r{text-align:right}
.t2{font-size:11.5px;color:var(--t2);line-height:1.5}
.po{color:var(--po)}.ne{color:var(--ne)}.ac{color:var(--ac)}.mu{color:var(--mu)}.in{color:var(--in)}
.nt{font-size:11.5px;color:var(--t2);line-height:1.65;padding:10px 13px;background:var(--wm);border:1px solid var(--ln);border-radius:5px;margin:11px 0}
.wn{border-left:3px solid var(--ac);background:var(--wm);padding:13px 16px;border-radius:0 5px 5px 0;margin:14px 0;font-size:12.5px;line-height:1.7}
.wn .h{font:600 9.5px/1 'IBM Plex Mono';letter-spacing:1.3px;color:var(--ac);text-transform:uppercase;margin-bottom:8px}
.wn.r{border-left-color:var(--ne);background:var(--rd)}.wn.r .h{color:var(--ne)}
.wn.g{border-left-color:var(--po);background:var(--cl)}.wn.g .h{color:var(--po)}
.big{font:700 34px/1 'IBM Plex Mono';letter-spacing:-1.5px}
.med{font:600 20px/1 'IBM Plex Mono';letter-spacing:-.5px}
.dk{font:600 9px/1 'IBM Plex Mono';letter-spacing:1.2px;color:var(--t2);text-transform:uppercase;margin-bottom:7px}
.sr{font:500 8px/1 'IBM Plex Mono';letter-spacing:.5px;padding:2px 5px;border-radius:2px;background:var(--wm);border:1px solid var(--ln);color:var(--mu);margin-left:6px;text-transform:uppercase;vertical-align:1px}
svg{display:block;max-width:100%}
.ch{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:16px;margin-bottom:13px}
.chh{font:600 11px/1 'IBM Plex Mono';letter-spacing:1.2px;color:var(--t2);text-transform:uppercase;margin-bottom:4px}
.chs{font-size:11.5px;color:var(--t2);margin-bottom:13px;line-height:1.55}
.pill{display:inline-block;font:600 10px/1 'IBM Plex Mono';padding:5px 10px;border-radius:20px;margin:0 4px 4px 0;cursor:pointer;border:1px solid var(--ln);background:var(--pn);color:var(--t2)}
.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
@media(max-width:760px){.w{padding:15px 12px 70px}.g2,.g3,.g4{grid-template-columns:1fr}
.hi{padding:10px 12px}.tabs{padding:0 12px}.lg{font-size:16px}.big{font-size:27px}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const SR=c=>`<span class="sr">${({co:'COMPANY',f4:'SEC FILING',ct:'OFFICIAL',an:'ANALYST',fe:'NEWS',de:'DERIVED',gap:'GAP'})[c]||c}</span>`;
function go(t){$$('.pn').forEach(p=>p.classList.toggle('on',p.id=='p-'+t));
$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==t));window.scrollTo(0,0);}
$$('.tab').forEach(x=>x.onclick=()=>go(x.dataset.t));

/* ───── CHART ENGINE ───── */
const W=780;
function bar(rows,o={}){
 const P={l:o.l||128,r:64,t:12,b:28}, mx=o.max||Math.max(...rows.map(r=>r[1]||0))*1.14;
 const bh=o.bh||27,gp=9,h=P.t+rows.length*(bh+gp)+P.b,iw=W-P.l-P.r;
 let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 for(let v=0;v<=mx;v+=(o.step||1)){const x=P.l+(v/mx)*iw;
  s+=`<line x1="${x}" y1="${P.t-4}" x2="${x}" y2="${h-P.b+2}" stroke="#e6e4de"/><text x="${x}" y="${h-P.b+17}" font-size="9" fill="#9d988c" text-anchor="middle">${v}${o.u||'%'}</text>`;}
 rows.forEach((r,i)=>{const y=P.t+i*(bh+gp),v=r[1],c=r[3]||'#8a6a1c';
  s+=`<text x="${P.l-10}" y="${y+bh/2+4}" font-size="11" fill="#1a1917" text-anchor="end" font-weight="600">${r[0]}</text>`;
  if(v==null){s+=`<rect x="${P.l}" y="${y}" width="${iw}" height="${bh}" fill="#f7f7f4" stroke="#e6e4de" stroke-dasharray="3 3" rx="2"/><text x="${P.l+11}" y="${y+bh/2+4}" font-size="9.5" fill="#9d988c" letter-spacing="1.2">GAP — NOT VERIFIED</text>`;}
  else{const bw=Math.max(2,(v/mx)*iw);
   s+=`<rect x="${P.l}" y="${y}" width="${bw}" height="${bh}" fill="${c}" rx="2"/><text x="${P.l+bw+8}" y="${y+bh/2+4}" font-size="11.5" fill="${c}" font-weight="700">${v.toFixed(2)}${o.u||'%'}</text>`;
   if(r[2])s+=`<text x="${P.l+7}" y="${y+bh/2+4}" font-size="9" fill="#fff" opacity=".92">${r[2]}</text>`;}});
 return s+`</svg>`;}

function grp(rows,o={}){
 const P={l:o.l||128,r:64,t:12,b:40}, mx=o.max||Math.max(...rows.flatMap(r=>r.slice(1).map(v=>v||0)))*1.14;
 const n=rows[0].length-1,bh=o.bh||12,gp=15,h=P.t+rows.length*(bh*n+gp)+P.b,iw=W-P.l-P.r;
 const C=o.c||['#2c5680','#c9a227','#9b2f2f'];
 let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 for(let v=0;v<=mx;v+=(o.step||1)){const x=P.l+(v/mx)*iw;
  s+=`<line x1="${x}" y1="${P.t-4}" x2="${x}" y2="${h-P.b-8}" stroke="#e6e4de"/><text x="${x}" y="${h-P.b+6}" font-size="9" fill="#9d988c" text-anchor="middle">${v}%</text>`;}
 rows.forEach((r,i)=>{const y0=P.t+i*(bh*n+gp);
  s+=`<text x="${P.l-10}" y="${y0+bh*n/2+4}" font-size="11" fill="#1a1917" text-anchor="end" font-weight="600">${r[0]}</text>`;
  for(let k=0;k<n;k++){const v=r[k+1],y=y0+k*bh,c=C[k];
   if(v==null){s+=`<rect x="${P.l}" y="${y}" width="42" height="${bh-1.5}" fill="#f7f7f4" stroke="#e6e4de" stroke-dasharray="2 2"/><text x="${P.l+47}" y="${y+bh-3}" font-size="8.5" fill="#9d988c">GAP</text>`;}
   else{const bw=Math.max(2,(v/mx)*iw);
    s+=`<rect x="${P.l}" y="${y}" width="${bw}" height="${bh-1.5}" fill="${c}" rx="1.5"/><text x="${P.l+bw+6}" y="${y+bh-3}" font-size="10" fill="${c}" font-weight="600">${v.toFixed(2)}</text>`;}}});
 (o.lb||[]).forEach((l,k)=>{s+=`<rect x="${P.l+k*160}" y="${h-16}" width="10" height="10" fill="${C[k]}" rx="1.5"/><text x="${P.l+k*160+15}" y="${h-7}" font-size="9.5" fill="#6b675e">${l}</text>`;});
 return s+`</svg>`;}

function div(rows,o={}){
 const P={l:o.l||128,r:64,t:12,b:28};
 const vs=rows.map(r=>r[1]).filter(v=>v!=null),mx=Math.max(...vs.map(Math.abs))*1.35||1;
 const bh=27,gp=9,h=P.t+rows.length*(bh+gp)+P.b,iw=W-P.l-P.r,z=P.l+iw/2;
 let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">
 <line x1="${z}" y1="${P.t-4}" x2="${z}" y2="${h-P.b+2}" stroke="#6b675e" stroke-width="1.5"/>
 <text x="${z}" y="${h-P.b+17}" font-size="9" fill="#6b675e" text-anchor="middle">0${o.u||'%'}</text>`;
 rows.forEach((r,i)=>{const y=P.t+i*(bh+gp),v=r[1];
  s+=`<text x="${P.l-10}" y="${y+bh/2+4}" font-size="11" fill="#1a1917" text-anchor="end" font-weight="600">${r[0]}</text>`;
  if(v==null){s+=`<text x="${z+9}" y="${y+bh/2+4}" font-size="9.5" fill="#9d988c" letter-spacing="1.2">GAP</text>`;}
  else{const bw=Math.abs(v)/(mx*2)*iw,c=v>=0?(o.pc||'#1d6b4c'):(o.nc||'#9b2f2f');
   s+=`<rect x="${v>=0?z:z-bw}" y="${y}" width="${bw}" height="${bh}" fill="${c}" rx="2"/>
   <text x="${v>=0?z+bw+8:z-bw-8}" y="${y+bh/2+4}" font-size="11.5" fill="${c}" font-weight="700" text-anchor="${v>=0?'start':'end'}">${v>0?'+':''}${v.toFixed(2)}${o.u||'%'}</text>`;}});
 return s+`</svg>`;}

function line(series,o={}){
 const P={l:52,r:14,t:14,b:26},h=o.h||190,iw=W-P.l-P.r,ih=h-P.t-P.b;
 const all=series.flatMap(s=>s.v),mn=o.min!=null?o.min:Math.min(...all)*.985,mx=o.max!=null?o.max:Math.max(...all)*1.015;
 const X=i=>P.l+(i/(o.x.length-1))*iw, Y=v=>P.t+ih-((v-mn)/(mx-mn))*ih;
 let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);
  s+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#e6e4de"/><text x="${P.l-7}" y="${y+3.5}" font-size="9" fill="#9d988c" text-anchor="end">${v.toFixed(o.dp!=null?o.dp:1)}</text>`;}
 o.x.forEach((lb,i)=>{s+=`<text x="${X(i)}" y="${h-8}" font-size="9" fill="#9d988c" text-anchor="middle">${lb}</text>`;});
 series.forEach(se=>{const pts=se.v.map((v,i)=>`${X(i)},${Y(v)}`);
  s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${se.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  se.v.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i==se.v.length-1?3.6:2.4}" fill="${se.c}"/>`;});
  s+=`<text x="${W-P.r-2}" y="${Y(se.v[se.v.length-1])-8}" font-size="10" fill="${se.c}" text-anchor="end" font-weight="700">${se.n}</text>`;});
 return s+`</svg>`;}

$("#c-rp").innerHTML=`
<div class="c h" style="border-color:var(--l2)">
 <div class="ct"><div>
  <div style="font:600 10px/1 'IBM Plex Mono';letter-spacing:1.6px;color:var(--t2)">SATURDAY 26 SEPTEMBER 2026 · THE SUMMIT ENDED WITH TEA, THE WAR MAY BE ENDING WITH A DEAL</div>
  <div style="font-size:21px;font-weight:600;margin-top:8px;line-height:1.35;max-width:820px">
   Trump-Xi wrapped with pageantry and few concrete announcements. The bigger story broke Friday: <b>the US and Iran moved toward lifting the Gulf naval blockades</b> — Brent fell below $98 and the 10-year's spike to <b>5.18%, the highest since the 2008 crisis</b>, reversed the same day. Stocks closed their first winning week in three</div></div>
  <span class="g p">OIL SUB-$98 · 10Y HIT 5.18% THEN EASED · SUMMIT LOW ON SUBSTANCE</span></div>
</div>

<h2><b>1</b> · THE ONE NUMBER</h2>
<div class="gr g3" style="margin-bottom:6px">
 <div class="c" style="border-color:#e6c8c8;background:var(--rd)"><div class="dk">Fed decision · delivered today</div><div class="big ne">+25bp</div>
  <div class="t2" style="margin-top:6px">3.50–3.75% → <b>3.75–4.00%</b>, 12-0 unanimous, first hike since 2023</div></div>
 <div class="c"><div class="dk">Your written threshold</div><div class="big ac">65%</div>
  <div class="t2" style="margin-top:6px">Was at 86% going in. This is the rule doing exactly what it said it would</div></div>
 <div class="c" style="border-color:#e6c8c8;background:var(--rd)"><div class="dk">New number to watch</div>
  <div class="big ne" style="font-size:25px">DOT PLOT</div>
  <div class="t2" style="margin-top:6px">Signals <b>another hike still to come</b> this year. That is now the open question</div></div>
</div>

<h2><b>2</b> · WHERE THINGS STAND</h2>
<div class="gr g2">
<div class="c"><div class="cl" style="margin-bottom:9px">Markets<s>Friday close — first winning week in three, oil breaks $98</s></div>
<div class="t"><table><tbody>
${[["S&P 500, Fri","7,743.41 (+0.51%)","Within 0.7% of its all-time high set last month","p"],
["<b>Dow Jones, Fri</b>","<b>51,828.62 (+478.64, +0.93%)</b>","<b>Snapped a three-week losing streak</b>","p"],
["Nasdaq Composite, Fri","27,068.72 (+0.5%)","Closed out its first winning week in three","p"],

["<b>Brent crude, Fri</b>","<b>below $98</b>","<b>Broke a fresh threshold on US-Iran naval-blockade talks</b>","p"],
["<b>Meta Platforms</b>","<b>+16.8% for the week</b>","Approaching $2 trillion market cap on its new 'Muse' AI agent","p"],
["Akamai","+3% Friday","Multiyear deal announced with Anthropic","p"],
["Gold / Silver, Fri AM","$4,337 (+0.91%) / $65.22 (+1.90%)","Both firmer even as risk appetite improved","p"],
["<b>Dow, month-to-date</b>","<b>Sharp recovery</b>","From −2.05% (worst Sept since 2008) to a positive week","p"]].map(r=>
`<tr class="wr"><td style="width:150px"><b>${r[0]}</b></td><td class="r m" style="width:120px">${r[1]}</td>
<td class="${r[3]=='n'?'ne':r[3]=='p'?'po':'ac'}">${r[2]}</td></tr>`).join("")}
</tbody></table></div></div>

<div class="c"><div class="cl" style="margin-bottom:9px">Rates and currencies<s>The engine underneath everything</s></div>
<div class="t"><table><tbody>
${[["<b>US 10-year</b>","<b>hit 5.18% intraday Friday, then eased</b>","<b>Highest since the 2008 financial crisis — reversed same-day as oil fell</b>","n"],
["US 5-year","touched 5% on Wed 23 Sep","First time since 2007","n"],
["US 2-year","4.744%","Highest since July 2024 — the Fed hike now fully priced","n"],
["US 30-year","~5.38%","New multi-decade high, off its peak by Friday","n"],
["Germany 10-year","~3.35%","<b>Spread to France still at a 14-year high</b> — French fiscal/political risk, not a US story","p"],
["UK 10-year","~5.22%, −8bp on the BoE hold","30-year gilts −12bp to 5.74% — a hold read as dovish relief","n"],
["Japan 10-year","1.25% policy rate, effective 24 Sep","31-year high — 7-2 split vote, two dissents","n"],
["EUR/USD","~1.152","One-month low on broad dollar strength post-Fed","a"],

<h2><b>6</b> · 1971, HONESTLY — WHAT'S REPEATING, AND WHAT'S CONSPICUOUSLY NOT</h2>
<div class="nt" style="margin-bottom:10px">Every "monetary reset" narrative this year reaches for 1971 — Nixon closing the gold window. Worth checking the parallel piece by piece rather than taking it whole.</div>
<div class="wn r" style="margin-bottom:10px"><div class="h">The number underneath all of it: $40 trillion, 125% of GDP</div>
US federal debt passed $40 trillion in August 2026 — <b>$117,000 per American</b>, and a debt-to-GDP ratio of roughly <b>125%</b>, higher than the WWII-era peak of 106%. Interest on that debt now exceeds the entire US defence budget. About 76% is held domestically (the Fed, banks, pension funds, households); 24% (~$9.3trn) is held by foreign investors — which is the channel through which today's 10-year and 5-year yield moves connect back to this bigger number. <b>This is the slow-moving fact that every faster-moving headline this month — the Fed, the gold repatriation, the tariffs, today's yield spike — sits on top of.</b><br><br>
<i>Onder elk snel nieuwsbericht deze maand ligt hetzelfde trage feit: een schuld die sneller groeit dan de economie die hem moet dragen. Het is niet het nieuws van vandaag — het is de grond waarop al het nieuws van vandaag staat.</i></div>

<div class="nt"><b>The one that matters most is the one that didn't happen.</b> In 1971-72, Fed Chair Arthur Burns caved to Nixon's pressure, held rates too low, and that decision is widely credited with helping seed the Great Inflation of the 1970s. This month's actual test of that exact mechanism — a President publicly demanding cuts, a Fed chair he appointed himself — produced the opposite result: a unanimous hike. <b>That is either the most reassuring fact on this whole page, or too early to call given the dot plot still signals more hikes to come.</b> The structural piece — no gold standard left to abandon — also means the 1971 comparison can describe the politics but never fully complete the mechanism; there is no window left for anyone to close.<br><br>
<i>De vorige keer boog de kapitein voor de reder en voer het schip recht op de klippen af. Deze keer zei de kapitein nee tegen dezelfde reder — maar het schip vaart nog steeds door hetzelfde nauwe kanaal, en niemand weet nog hoe diep het water daar is.</i></div>`;
