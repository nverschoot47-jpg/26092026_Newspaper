/* ───── CHART ENGINE ───── */
const W=780;
function bar(rows,o={}){
 const P={l:o.l||128,r:64,t:12,b:28}, mx=o.max||Math.max(...rows.map(r=>r[1]||0))*1.14;
 const bh=o.bh||27,gp=9,h=P.t+rows.length*(bh+gp)+P.b,iw=W-P.l-P.r;
 let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 for(let v=0;v<=mx;v+=(o.step||1)){const x=P.l+(v/mx)*iw;
  s+=`<line x1="${x}" y1="${P.t-4}" x2="${x}" y2="${h-P.b+2}" stroke="#e6e4de"/><text x="${x}" y="${h-P.b+17}" font-size="9" fill="#9d988c" text-anchor="middle">${v}${o.u||'%'}</text>`;}
 rows.forEach((r,i)=>{const y=P.t+i*(bh+gp),v=r[1],c=r[3]||'#8a6a1c';
  s+=`<text x="${P.l-10}" y="${y+bh/2+4}" font-size="11" fill="#1a1917" text-anchor="end" font-weight="600">${r[0]}</text>`;
  if(v==null){s+=`<rect x="${P.l}" y="${y}" width="${iw}" height="${bh}" fill="#f7f7f4" stroke="#e6e4de" stroke-dasharray="3 3" rx="2"/><text x="${P.l+11}" y="${y+bh/2+4}" font-size="9.5" fill="#9d988c" letter-spacing="1.2">GAP — NOT VERIFIED</text>`;}
  else{const bw=Math.max(2,(v/mx)*iw);
   s+=`<rect x="${P.l}" y="${y}" width="${bw}" height="${bh}" fill="${c}" rx="2"/><text x="${P.l+bw+8}" y="${y+bh/2+4}" font-size="11.5" fill="${c}" font-weight="700">${v.toFixed(2)}${o.u||'%'}</text>`;
   if(r[2])s+=`<text x="${P.l+7}" y="${y+bh/2+4}" font-size="9" fill="#fff" opacity=".92">${r[2]}</text>`;}});
 return s+`</svg>`;}

function grp(rows,o={}){
 const P={l:o.l||128,r:64,t:12,b:40}, mx=o.max||Math.max(...rows.flatMap(r=>r.slice(1).map(v=>v||0)))*1.14;
 const n=rows[0].length-1,bh=o.bh||12,gp=15,h=P.t+rows.length*(bh*n+gp)+P.b,iw=W-P.l-P.r;
 const C=o.c||['#2c5680','#c9a227','#9b2f2f'];
 let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 for(let v=0;v<=mx;v+=(o.step||1)){const x=P.l+(v/mx)*iw;
  s+=`<line x1="${x}" y1="${P.t-4}" x2="${x}" y2="${h-P.b-8}" stroke="#e6e4de"/><text x="${x}" y="${h-P.b+6}" font-size="9" fill="#9d988c" text-anchor="middle">${v}%</text>`;}
 rows.forEach((r,i)=>{const y0=P.t+i*(bh*n+gp);
  s+=`<text x="${P.l-10}" y="${y0+bh*n/2+4}" font-size="11" fill="#1a1917" text-anchor="end" font-weight="600">${r[0]}</text>`;
  for(let k=0;k<n;k++){const v=r[k+1],y=y0+k*bh,c=C[k];
   if(v==null){s+=`<rect x="${P.l}" y="${y}" width="42" height="${bh-1.5}" fill="#f7f7f4" stroke="#e6e4de" stroke-dasharray="2 2"/><text x="${P.l+47}" y="${y+bh-3}" font-size="8.5" fill="#9d988c">GAP</text>`;}
   else{const bw=Math.max(2,(v/mx)*iw);
    s+=`<rect x="${P.l}" y="${y}" width="${bw}" height="${bh-1.5}" fill="${c}" rx="1.5"/><text x="${P.l+bw+6}" y="${y+bh-3}" font-size="10" fill="${c}" font-weight="600">${v.toFixed(2)}</text>`;}}});
 (o.lb||[]).forEach((l,k)=>{s+=`<rect x="${P.l+k*160}" y="${h-16}" width="10" height="10" fill="${C[k]}" rx="1.5"/><text x="${P.l+k*160+15}" y="${h-7}" font-size="9.5" fill="#6b675e">${l}</text>`;});
 return s+`</svg>`;}

function div(rows,o={}){
 const P={l:o.l||128,r:64,t:12,b:28};
 const vs=rows.map(r=>r[1]).filter(v=>v!=null),mx=Math.max(...vs.map(Math.abs))*1.35||1;
 const bh=27,gp=9,h=P.t+rows.length*(bh+gp)+P.b,iw=W-P.l-P.r,z=P.l+iw/2;
 let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">
 <line x1="${z}" y1="${P.t-4}" x2="${z}" y2="${h-P.b+2}" stroke="#6b675e" stroke-width="1.5"/>
 <text x="${z}" y="${h-P.b+17}" font-size="9" fill="#6b675e" text-anchor="middle">0${o.u||'%'}</text>`;
 rows.forEach((r,i)=>{const y=P.t+i*(bh+gp),v=r[1];
  s+=`<text x="${P.l-10}" y="${y+bh/2+4}" font-size="11" fill="#1a1917" text-anchor="end" font-weight="600">${r[0]}</text>`;
  if(v==null){s+=`<text x="${z+9}" y="${y+bh/2+4}" font-size="9.5" fill="#9d988c" letter-spacing="1.2">GAP</text>`;}
  else{const bw=Math.abs(v)/(mx*2)*iw,c=v>=0?(o.pc||'#1d6b4c'):(o.nc||'#9b2f2f');
   s+=`<rect x="${v>=0?z:z-bw}" y="${y}" width="${bw}" height="${bh}" fill="${c}" rx="2"/>
   <text x="${v>=0?z+bw+8:z-bw-8}" y="${y+bh/2+4}" font-size="11.5" fill="${c}" font-weight="700" text-anchor="${v>=0?'start':'end'}">${v>0?'+':''}${v.toFixed(2)}${o.u||'%'}</text>`;}});
 return s+`</svg>`;}

function line(series,o={}){
 const P={l:52,r:14,t:14,b:26},h=o.h||190,iw=W-P.l-P.r,ih=h-P.t-P.b;
 const all=series.flatMap(s=>s.v),mn=o.min!=null?o.min:Math.min(...all)*.985,mx=o.max!=null?o.max:Math.max(...all)*1.015;
 const X=i=>P.l+(i/(o.x.length-1))*iw, Y=v=>P.t+ih-((v-mn)/(mx-mn))*ih;
 let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);
  s+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#e6e4de"/><text x="${P.l-7}" y="${y+3.5}" font-size="9" fill="#9d988c" text-anchor="end">${v.toFixed(o.dp!=null?o.dp:1)}</text>`;}
 o.x.forEach((lb,i)=>{s+=`<text x="${X(i)}" y="${h-8}" font-size="9" fill="#9d988c" text-anchor="middle">${lb}</text>`;});
 series.forEach(se=>{const pts=se.v.map((v,i)=>`${X(i)},${Y(v)}`);
  s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${se.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  se.v.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i==se.v.length-1?3.6:2.4}" fill="${se.c}"/>`;});
  s+=`<text x="${W-P.r-2}" y="${Y(se.v[se.v.length-1])-8}" font-size="10" fill="${se.c}" text-anchor="end" font-weight="700">${se.n}</text>`;});
 return s+`</svg>`;}

<h2><b>6</b> · 1971, HONESTLY — WHAT'S REPEATING, AND WHAT'S CONSPICUOUSLY NOT</h2>
<div class="nt" style="margin-bottom:10px">Every "monetary reset" narrative this year reaches for 1971 — Nixon closing the gold window. Worth checking the parallel piece by piece rather than taking it whole.</div>
<div class="wn r" style="margin-bottom:10px"><div class="h">The number underneath all of it: $40 trillion, 125% of GDP</div>
US federal debt passed $40 trillion in August 2026 — <b>$117,000 per American</b>, and a debt-to-GDP ratio of roughly <b>125%</b>, higher than the WWII-era peak of 106%. Interest on that debt now exceeds the entire US defence budget. About 76% is held domestically (the Fed, banks, pension funds, households); 24% (~$9.3trn) is held by foreign investors — which is the channel through which today's 10-year and 5-year yield moves connect back to this bigger number. <b>This is the slow-moving fact that every faster-moving headline this month — the Fed, the gold repatriation, the tariffs, today's yield spike — sits on top of.</b><br><br>
<i>Onder elk snel nieuwsbericht deze maand ligt hetzelfde trage feit: een schuld die sneller groeit dan de economie die hem moet dragen. Het is niet het nieuws van vandaag — het is de grond waarop al het nieuws van vandaag staat.</i></div>
<div class="t" style="margin-bottom:10px"><table><thead><tr><th style="width:220px">1971 element</th><th>Echo in 2026</th><th style="width:110px">Verdict</th></tr></thead><tbody>

["An energy shock feeding inflation just as rates were already stretched","Hormuz/Bab al-Mandeb chokepoint war pushing oil and the CPI print that fired this dashboard's trigger","Repeating","p"],
["<b>The Fed chair actually caving to the pressure</b>","<b>Warsh did the opposite — hiked 12-0 while Trump demanded cuts</b>","<b>NOT repeating — the strange one</b>","n"],
["A literal gold-dollar link to break (Bretton Woods convertibility)","No such link exists anymore — it was severed in 1971. There is no window left to close","Can't repeat — structurally absent","n"],
["Wage and price controls as a companion policy","No equivalent proposal on the table in 2026 despite similar inflation rhetoric","Not repeating","n"],
["A currency devaluation / realignment event (Smithsonian Agreement, 1971-73)","The dollar index just had its best week in months — strengthening, not devaluing","Not repeating — opposite direction","n"]].map(r=>
`<tr class="wr"><td><b>${r[0]}</b></td><td class="t2">${r[1]}</td><td class="${r[3]=='n'?'ne':'po'} m">${r[2]}</td></tr>`).join("")}
</tbody></table></div>
<div class="nt"><b>The one that matters most is the one that didn't happen.</b> In 1971-72, Fed Chair Arthur Burns caved to Nixon's pressure, held rates too low, and that decision is widely credited with helping seed the Great Inflation of the 1970s. This month's actual test of that exact mechanism — a President publicly demanding cuts, a Fed chair he appointed himself — produced the opposite result: a unanimous hike. <b>That is either the most reassuring fact on this whole page, or too early to call given the dot plot still signals more hikes to come.</b> The structural piece — no gold standard left to abandon — also means the 1971 comparison can describe the politics but never fully complete the mechanism; there is no window left for anyone to close.<br><br>
<i>De vorige keer boog de kapitein voor de reder en voer het schip recht op de klippen af. Deze keer zei de kapitein nee tegen dezelfde reder — maar het schip vaart nog steeds door hetzelfde nauwe kanaal, en niemand weet nog hoe diep het water daar is.</i></div>`;

 rows.forEach((a,i)=>rows.forEach((b,j)=>{const x=lb+j*cs,y=lb+i*cs;

 return s+`</svg>`;}

<i>Het Amerikaanse inflatiecijfer is de hoofdschakelaar voor het licht in alle kamers. Maar elke kamer heeft ook nog een eigen lamp die op een eigen knop werkt.</i></div>

<div class="wn"><div class="h">What quad witching actually is</div>
Four kinds of contract expire on the same day: index futures, index options, single-stock futures and single-stock options. Everyone holding them must close, roll or take delivery <b>on that day</b>.<br><br>
That produces enormous volume and exaggerated moves — <b>and none of it is news.</b> It amplifies whatever direction already exists.<br><br>
<i>Iedereen in het dorp moet op dezelfde dag zijn huur betalen. Er is die dag enorm veel geldverkeer en de prijzen schieten heen en weer — maar er is niets gebeurd. <b>Alleen de kalender.</b></i></div>

<div class="wn r"><div class="h">For you specifically: the daily maintenance halt, in Belgian time</div>
Every CME futures session pauses <b>16:00–17:00 Central Time</b> for daily maintenance/settlement — that's <b>23:00–00:00 Belgian time</b> during CEST (summer clock), or <b>22:00–23:00 from Sunday 26 October until Saturday 1 November</b> (Belgium switched to winter time this weekend while the US is still on summer time; US switches on Sunday 2 November), and back to 23:00–00:00 from 2 November. <b>This week: Wall Street opens at 14:30 Belgian time instead of 15:30</b>. Spreads widen sharply inside that hour because market makers pull back; they normalise within minutes of the 17:00 CT reopen, and get progressively tighter as the Asian session builds from roughly 01:00–02:00 Belgian time onward. <b>This applies to MNQ, MGC, SIL and MCL — not to UK100/DAX as cash indices</b>, which simply reflect their own exchange's closing hours instead.<br><br>
<i>Elke dag, rond middernacht Belgische tijd, legt de beurs een uur lang het werk stil voor onderhoud. De brede spread die je dan ziet is geen paniek — het is gewoon niemand aan het loket.</i></div>

<div class="wn"><div class="h">The one distinction that trips people up</div>
<b>MNQ and MGC/SIL trade the same four-times-a-year rhythm as this dashboard's quad-witching calendar — MCL does not.</b> Crude oil expires <i>monthly</i>, with volume rolling to the next contract about a week before, on what traders call "rollover Thursday." A position held into that window without rolling can end up settling against a different month's price than expected. Gold and silver are technically monthly-listed too, but are physically deliverable — which is precisely why almost nobody holds a micro gold or silver position into expiry; the delivery mechanics are built for commercial users, not a retail account.<br><br>
<i>Drie van je vier instrumenten volgen hetzelfde kwartaalritme als de rest van dit dashboard. De olie loopt op een eigen, maandelijkse klok — wie daar niet op let, betaalt de rekening op de verkeerde dag.</i></div>

<div class="wn r"><div class="h">Still worth a live check before trading</div>
<b>Margins move with volatility</b> — the figures above are reference points, not this session's requirement; the exchange raised gold and silver margins earlier this month. <b>Confirm current margin and the active front-month contract with your broker or on the CME margin page before sizing any position.</b> ATR and implied-volatility readings were not independently re-verified this pass; qualitatively, silver still trades with meaningfully wider swings than gold, and oil remains in a 5%+ daily-move regime given the active Hormuz situation.</div>`;
